<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6366f1">
  <title>TaskFlow - Dang ngoai tuyen</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { align-items: center; background: #0a0e1a; color: #f1f5f9; display: flex; justify-content: center; margin: 0; min-height: 100vh; text-align: center; }
    main { max-width: 420px; padding: 32px; }
    .icon { background: #6366f1; border-radius: 24px; display: inline-grid; height: 72px; place-items: center; width: 72px; }
    h1 { font-size: 24px; margin: 24px 0 12px; }
    p { color: #94a3b8; line-height: 1.6; }
    button { background: #818cf8; border: 0; border-radius: 10px; color: #0f172a; cursor: pointer; font: inherit; font-weight: 700; margin-top: 16px; padding: 12px 18px; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">T</div>
    <h1>Bạn đang ngoại tuyến</h1>
    <p>TaskFlow chưa tải được trang này khi không có kết nối mạng. Hãy thử lại khi kết nối được khôi phục.</p>
    <button type="button" onclick="location.reload()">Thử lại</button>
  </main>
</body>
</html>
